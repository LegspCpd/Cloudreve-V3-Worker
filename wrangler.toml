#:schema node_modules/wrangler/config-schema.json
name = "cloudreve-v3-worker"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# 关键：wrangler 默认把本文件当成唯一事实来源，部署时会覆盖/删除你在面板里设置的
# 变量（含 Neon 连接串等）。开启后，配置里没有声明的变量与密钥都会原样保留，
# 面板上设置的变量不再被部署清空。因此 [vars] 里也不放任何占位空串。
keep_vars = true

# 前端静态资源（原版 React 构建产物）。
#   binding = "ASSETS"：Worker 通过 env.ASSETS 读取静态文件；
#   run_worker_first = true：所有请求先经过 Worker，再由 Worker 决定
#     - /api/v3/*、/dav/*    → 后端路由
#     - /static/*、/locales/* → env.ASSETS 直接返回
#     - 其余（/、/login 等）  → 返回替换过站点设置的 index.html
#   必须让 index.html 经过 Worker，否则 siteName / siteDes / pwa_small_icon 等
#   占位符无法替换（原版由 Gin 中间件 middleware/frontend.go 完成替换）。
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ───────────────────────────────────────────────────────────
# 运行时变量：只放与用户配置无关的默认值。
# 数据库连接串、RESEND_API_KEY、SESSION_SECRET、HASHID_SALT、SITE_URL、
# MAIL_FROM_* 一律不在此声明（声明了就会覆盖面板上的值，即使是空串）：
#   - 连接串：构建时由 scripts/setup.mjs + deploy.mjs 自动注入
#   - 其余密钥：由 scripts/apply-secrets.mjs 用 wrangler secret put 写入
# keep_vars = true 会保留面板上设置的其它变量与密钥。
# ───────────────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
MAX_KV_NAMESPACES = "5"
MAX_NEON_DATABASES = "5"

# ───────────────────────────────────────────────────────────
# R2：作为「本地存储」策略的实际存储桶（由 scripts/setup.mjs 自动创建/复用）
# 桶名统一带 cloudreve-v3 前缀，避免与 Cloudreve V4 等其他版本冲突
# ───────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "cloudreve-v3-storage"

# 观测
[observability]
enabled = true

# 本地开发覆盖
[env.dev]
name = "cloudreve-v3-worker-dev"
[env.dev.vars]
ENVIRONMENT = "dev"
SITE_URL = "http://localhost:8787"
