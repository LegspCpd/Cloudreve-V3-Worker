#:schema node_modules/wrangler/config-schema.json
name = "cloudreve-v3-worker"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# 前端静态资源（原版 React 构建产物）。
#   binding = "ASSETS"：Worker 通过 env.ASSETS 读取静态文件；
#   run_worker_first = true：所有请求先经过 Worker，再由 Worker 决定
#     - /api/v3/*、/dav/*    → 后端路由
#     - /static/*、/locales/* → env.ASSETS 直接返回
#     - 其余（/、/login 等）  → 返回替换过站点设置的 index.html
#   必须让 index.html 经过 Worker，否则 siteName / siteDes / pwa_small_icon 等
#   占位符无法替换（原版由 Gin 中间件 middleware/frontend.go 完成替换）。
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ───────────────────────────────────────────────────────────
# 运行时变量（非敏感的默认值；敏感信息请用 wrangler secret put 设置）
# ───────────────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
# 数据库连接串与上限：由 scripts/setup.mjs 自动写入 .dev.vars / secret，请勿在此填写
MAX_KV_NAMESPACES = "5"
MAX_NEON_DATABASES = "5"
DATABASE_URL = ""
DATABASE_URL_BACKUP = ""
DATABASE_URL_CACHE_1 = ""
DATABASE_URL_CACHE_2 = ""
DATABASE_URL_CACHE_3 = ""
# Resend 邮件（secret：wrangler secret put RESEND_API_KEY）
RESEND_API_KEY = ""
MAIL_FROM_ADDRESS = "no-reply@example.com"
MAIL_FROM_NAME = "CloudrevePlus"
# 会话签名密钥与 HashID 盐值（secret）
SESSION_SECRET = ""
HASHID_SALT = ""
# 站点对外地址（末尾不要带斜杠）
SITE_URL = "https://your-worker.example.workers.dev"

# ───────────────────────────────────────────────────────────
# R2：作为「本地存储」策略的实际存储桶（由 scripts/setup.mjs 自动创建/复用）
# 桶名统一带 cloudreve-v3 前缀，避免与 Cloudreve V4 等其他版本冲突
# ───────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "cloudreve-v3-storage"

# 观测
[observability]
enabled = true

# 本地开发覆盖
[env.dev]
name = "cloudreve-v3-worker-dev"
[env.dev.vars]
ENVIRONMENT = "dev"
SITE_URL = "http://localhost:8787"
