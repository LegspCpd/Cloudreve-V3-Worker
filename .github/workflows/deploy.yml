# 这个工作流只做构建检查，不做部署、不创建任何资源。
# 部署方式：Cloudflare 面板 Workers & Pages → Connect repository →
# Deploy command 填 `npm run deploy`，一键完成建库/建表/种子数据/构建/部署。
# 详见 README「一键部署」。

name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--openssl-legacy-provider"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          # public/ 必须包含静态资源目录，否则线上 /static/*、/locales/* 会全部 404
          for p in public/index.html public/asset-manifest.json public/static/js public/locales; do
            if [ ! -e "$p" ]; then
              echo "::error::前端构建产物缺失：$p"
              exit 1
            fi
          done
          echo "✔ 前端构建产物正常（$(find public -type f | wc -l) 个文件）"

      - name: Verify wrangler config
        run: npx wrangler deploy --dry-run
