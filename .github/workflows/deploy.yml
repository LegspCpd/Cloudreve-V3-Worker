# 这个工作流只做两件事：
#   1. 检查代码能否正常构建（每次推送 / PR 自动跑）
#   2. 提供一键初始化资源的手动入口（创建 KV 与 Neon 数据库、建表、种子数据）
#
# 部署不在这里做。部署方式：Cloudflare 面板 → Workers & Pages → Create →
# Connect repository → 选这个仓库，填 Build command / Deploy command / 环境变量。
# 详见 DEPLOY.md「方式一」。

name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      setup:
        description: "初始化资源：自动创建 KV 命名空间与 Neon 数据库（需要 NEON_API_KEY / NEON_PROJECT_ID）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--openssl-legacy-provider"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      MAX_KV_NAMESPACES: ${{ vars.MAX_KV_NAMESPACES || '5' }}
      MAX_NEON_DATABASES: ${{ vars.MAX_NEON_DATABASES || '5' }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f public/index.html ]; then
            echo "::error::前端构建产物缺失（public/index.html 不存在）"
            exit 1
          fi
          echo "✔ 前端构建产物正常（$(ls public | wc -l) 个文件）"

      - name: Verify wrangler config
        run: npx wrangler deploy --dry-run

      # ── 资源初始化（手动触发时才执行）──
      - name: Setup resources
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.setup == 'true' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run setup

      - name: Apply Worker secrets
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.setup == 'true' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run secrets:apply

      # ── 把自动生成的 KV 配置提交回仓库，供 Workers Builds 部署使用 ──
      - name: Commit generated wrangler.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.setup == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          if git diff --cached --quiet; then
            echo "wrangler.toml 无变化，无需提交"
          else
            git commit -m "chore: 自动写入 KV 命名空间配置 [skip ci]"
            git push
          fi

      - name: Summary
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.setup == 'true' }}
        run: |
          echo "## 初始化完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "KV 命名空间与 Neon 数据库已创建并写入 wrangler.toml。" >> $GITHUB_STEP_SUMMARY
          echo "接下来到 Cloudflare 面板 Workers & Pages 连接本仓库部署（见 DEPLOY.md）。" >> $GITHUB_STEP_SUMMARY
