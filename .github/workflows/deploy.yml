name: Deploy to Cloudflare Workers

# 在 GitHub 仓库面板上：Actions 标签页 → "Deploy to Cloudflare Workers" → Run workflow
# Fork 后首次运行前，请先到 Settings → Secrets and variables → Actions 填好变量（见 DEPLOY.md）

on:
  workflow_dispatch:
    inputs:
      setup:
        description: "首次部署：自动创建 KV 命名空间与 Neon 数据库（需要 NEON_API_KEY / NEON_PROJECT_ID）"
        type: boolean
        required: false
        default: false
      build_frontend:
        description: "构建前端（首次部署与前端有更新时勾选）"
        type: boolean
        required: false
        default: true
      apply_secrets:
        description: "把变量写入 Worker secret（首次部署必选；已写入过可关闭）"
        type: boolean
        required: false
        default: true
      worker_name:
        description: "Worker 名称（留空使用 cloudreve-v3-worker）"
        required: false
        default: ""
      site_url:
        description: "站点对外地址，如 https://xxx.workers.dev（留空则不修改）"
        required: false
        default: ""

# 需要 contents: write 以便把自动生成的 KV 配置提交回仓库
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 旧版 Create React App 在 Node 20+ 上需要此选项
      NODE_OPTIONS: "--openssl-legacy-provider"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      MAX_KV_NAMESPACES: ${{ vars.MAX_KV_NAMESPACES || '5' }}
      MAX_NEON_DATABASES: ${{ vars.MAX_NEON_DATABASES || '5' }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply worker name / site URL overrides
        if: ${{ github.event.inputs.worker_name != '' || github.event.inputs.site_url != '' }}
        run: |
          if [ -n "${{ github.event.inputs.worker_name }}" ]; then
            sed -i "s|^name = .*|name = \"${{ github.event.inputs.worker_name }}\"|" wrangler.toml
          fi
          if [ -n "${{ github.event.inputs.site_url }}" ]; then
            sed -i "s|^SITE_URL = .*|SITE_URL = \"${{ github.event.inputs.site_url }}\"|" wrangler.toml
          fi
          echo "--- 应用后的配置 ---"
          grep -E "^(name|SITE_URL) = " wrangler.toml

      # ── 资源初始化（自动创建 KV + Neon + 表结构 + 种子数据）──
      - name: Setup resources (auto-create KV and Neon databases)
        if: ${{ github.event.inputs.setup == 'true' && env.NEON_API_KEY != '' }}
        run: npm run setup

      # ── 手动数据库模式：把 secrets 写成 .env 供建表使用 ──
      - name: Write .env from secrets (manual database mode)
        if: ${{ github.event.inputs.setup != 'true' }}
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "DATABASE_URL_BACKUP=${{ secrets.DATABASE_URL_BACKUP }}"
            echo "DATABASE_URL_CACHE_1=${{ secrets.DATABASE_URL_CACHE_1 }}"
            echo "DATABASE_URL_CACHE_2=${{ secrets.DATABASE_URL_CACHE_2 }}"
            echo "DATABASE_URL_CACHE_3=${{ secrets.DATABASE_URL_CACHE_3 }}"
          } > .env
          echo ".env 已生成（仅用于本次构建，不会提交）"

      - name: Initialize database schema and seed data
        if: ${{ github.event.inputs.setup != 'true' }}
        run: |
          npm run db:push
          npm run db:seed

      - name: Build frontend
        if: ${{ github.event.inputs.build_frontend == 'true' }}
        run: npm run build

      - name: Create R2 bucket if missing
        run: npx wrangler r2 bucket create cloudreve-storage || echo "bucket already exists, continue"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # ── 把变量写入 Worker secret（值来自 .env 或环境变量）──
      - name: Apply Worker secrets
        if: ${{ github.event.inputs.apply_secrets == 'true' }}
        run: npm run secrets:apply

      # ── 把自动生成的 KV 配置提交回仓库，供后续部署使用 ──
      - name: Commit generated wrangler.toml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          if git diff --cached --quiet; then
            echo "wrangler.toml 无变化，无需提交"
          else
            git commit -m "chore: 自动写入 KV 命名空间配置 [skip ci]"
            git push
          fi

      - name: Summary
        run: |
          echo "## 部署结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.worker_name }}" ]; then
            echo "✅ Worker 已部署：\`${{ github.event.inputs.worker_name }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Worker 已部署：\`cloudreve-v3-worker\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "下一步：在 Cloudflare 面板查看 Worker 地址，用初始化时打印的管理员账号登录后台。" >> $GITHUB_STEP_SUMMARY
